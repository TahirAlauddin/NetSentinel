services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: netsentinel-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    volumes:
      - ./src/backend:/app
      - backend_db:/app/data
    networks:
      - netsentinel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        SERVER_API_URL: ${SERVER_API_URL:-http://backend:8000/api/v1}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-secret-key}
    container_name: netsentinel-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netsentinel-network

volumes:
  backend_db:

networks:
  netsentinel-network:
    driver: bridge

