services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: netsentinel-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    volumes:
      - ./src/backend:/app
      - backend_db:/app/data
    networks:
      - netsentinel-network
    # Security: Run as non-root user
    user: "django:django"
    # Resource limits to prevent DoS
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Security: Read-only root filesystem where possible
    read_only: false  # Set to true if no writes needed to root filesystem
    # Security: Drop all capabilities and add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        SERVER_API_URL: ${SERVER_API_URL:-http://backend:8000/api/v1}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        # Note: NEXTAUTH_SECRET should be set via environment variable at runtime, not build arg
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-secret-key}
    container_name: netsentinel-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    # Security: Run as non-root user
    user: "nextjs:nodejs"
    # Resource limits to prevent DoS
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netsentinel-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  backend_db:

networks:
  netsentinel-network:
    driver: bridge

