[pytest]
# Django settings module - use test settings for pytest
DJANGO_SETTINGS_MODULE = core.test_settings

# Python files and directories
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Test discovery patterns
testpaths = .

# Add current directory to Python path
# Note: Coverage and database reuse options are commented out by default
# Uncomment them if you have the required packages installed
addopts = 
    --strict-markers
    --tb=short
    -v
    # Uncomment below for faster test runs (requires pytest-django)
    # --reuse-db
    # Uncomment below for coverage reports (requires pytest-cov)
    # --cov=.
    # --cov-report=term-missing
    # --cov-report=html
    # --cov-report=xml

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no database)
    integration: Integration tests (may use database)
    api: API endpoint tests
    slow: Slow running tests
    requires_db: Tests that require database access

# Coverage options
[coverage:run]
source = .
omit =
    */migrations/*
    */venv/*
    */__pycache__/*
    */tests/*
    */test_*.py
    manage.py
    */settings.py
    */wsgi.py
    */asgi.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

