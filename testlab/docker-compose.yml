# testlab/docker-compose.yml
#
# NetSentinel AI Remediation Testlab
# ────────────────────────────────────
# Spins up a Zabbix monitoring stack + 5 simulated "hosts" (Docker containers).
# Fault injection: ./scripts/inject.sh <fault>
# AI agent       : cd agent && python agent.py
# Zabbix UI      : http://localhost:8090  (admin / zabbix)

services:

  # ── Zabbix monitoring stack ─────────────────────────────────────────────────

  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks: [monitoring]
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    depends_on: [zabbix-db]
    networks: [monitoring, hosts]
    restart: unless-stopped
    # Docker socket lets Zabbix-server run remediation scripts (docker restart …)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: zabbix-web
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Asia/Karachi
    ports:
      - "8090:8080"
    depends_on: [zabbix-server]
    networks: [monitoring]
    restart: unless-stopped

  # ── Host 1: web-server ──────────────────────────────────────────────────────
  # nginx serving a static page.
  # Faults: web-down, web-disk-full

  web-server:
    image: nginx:alpine
    container_name: host-web-server
    volumes:
      - ./hosts/web-server/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./hosts/web-server/html:/usr/share/nginx/html:ro
      - web-logs:/var/log/nginx
    ports:
      - "8080:80"
    networks: [hosts]
    restart: unless-stopped

  zabbix-agent-web:
    image: zabbix/zabbix-agent2:alpine-7.4-latest
    container_name: agent-web-server
    hostname: agent-web-server
    environment:
      ZBX_HOSTNAME: web-server
      ZBX_SERVER_HOST: zabbix-server
      ZBX_PASSIVE_ALLOW: "true"
    volumes:
      - web-logs:/var/log/nginx:ro
      - ./hosts/web-server/zabbix_agent.conf:/etc/zabbix/zabbix_agent2.conf:ro
    pid: "service:web-server"
    networks: [hosts]
    depends_on: [web-server, zabbix-server]
    restart: unless-stopped

  # ── Host 2: app-server ──────────────────────────────────────────────────────
  # FastAPI app with leak / CPU-spike / crash endpoints.
  # Faults: app-memory-leak, app-cpu-spike, app-crash-loop

  app-server:
    build: ./hosts/app-server
    container_name: host-app-server
    ports:
      - "8000:8000"
    networks: [hosts]
    mem_limit: 512m
    restart: unless-stopped

  zabbix-agent-app:
    image: zabbix/zabbix-agent2:alpine-7.4-latest
    container_name: agent-app-server
    hostname: agent-app-server
    environment:
      ZBX_HOSTNAME: app-server
      ZBX_SERVER_HOST: zabbix-server
    pid: "service:app-server"
    networks: [hosts]
    depends_on: [app-server, zabbix-server]
    restart: unless-stopped

  # ── Host 3: db-server ───────────────────────────────────────────────────────
  # PostgreSQL with a low connection limit.
  # Faults: db-connection-exhaustion, db-long-query

  db-server:
    image: postgres:16-alpine
    container_name: host-db-server
    environment:
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: appdb
    command: postgres -c max_connections=20 -c log_min_duration_statement=500
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./hosts/db-server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [hosts]
    restart: unless-stopped

  zabbix-agent-db:
    build:
      context: ./hosts/db-server
      dockerfile: agent.Dockerfile
    container_name: agent-db-server
    hostname: agent-db-server
    environment:
      ZBX_HOSTNAME: db-server
      ZBX_SERVER_HOST: zabbix-server
      PGPASSWORD: dbpass
    pid: "service:db-server"
    networks: [hosts]
    depends_on: [db-server, zabbix-server]
    restart: unless-stopped

  # ── Host 4: cache-server ────────────────────────────────────────────────────
  # Redis with a very low maxmemory.
  # Faults: cache-eviction-storm, cache-down

  cache-server:
    image: redis:7-alpine
    container_name: host-cache-server
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --loglevel verbose
    networks: [hosts]
    restart: unless-stopped

  zabbix-agent-cache:
    image: zabbix/zabbix-agent2:alpine-7.4-latest
    container_name: agent-cache-server
    hostname: agent-cache-server
    environment:
      ZBX_HOSTNAME: cache-server
      ZBX_SERVER_HOST: zabbix-server
    pid: "service:cache-server"
    networks: [hosts]
    depends_on: [cache-server, zabbix-server]
    restart: unless-stopped

  # ── Host 5: worker-server ───────────────────────────────────────────────────
  # Celery worker backed by Redis.
  # Faults: worker-queue-backup

  worker-server:
    build: ./hosts/worker-server
    container_name: host-worker-server
    environment:
      REDIS_URL: redis://cache-server:6379/0
    depends_on: [cache-server]
    networks: [hosts]
    restart: unless-stopped

  zabbix-agent-worker:
    image: zabbix/zabbix-agent2:alpine-7.4-latest
    container_name: agent-worker-server
    hostname: agent-worker-server
    environment:
      ZBX_HOSTNAME: worker-server
      ZBX_SERVER_HOST: zabbix-server
    pid: "service:worker-server"
    networks: [hosts]
    depends_on: [worker-server, zabbix-server]
    restart: unless-stopped

networks:
  monitoring:
  hosts:

volumes:
  zabbix-db-data:
  web-logs:
  db-data:
