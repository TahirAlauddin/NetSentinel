# testlab/docker-compose.yml
#
# NetSentinel AI Remediation Testlab
# ────────────────────────────────────
# Spins up a Zabbix monitoring stack + 5 simulated "hosts" (Docker containers).
# Fault injection: ./scripts/inject.sh <fault>
# AI agent       : cd agent && python agent.py
# Zabbix UI      : http://localhost:8080  (admin / zabbix)

services:

  # ── Zabbix monitoring stack ─────────────────────────────────────────────────

  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks: [monitoring]
    restart: unless-stopped

  zabbix-server:
    build: ./zabbix-server
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    depends_on: [zabbix-db]
    networks: [monitoring, hosts]
    restart: unless-stopped
    # Docker socket lets Zabbix-server run remediation scripts (docker restart …)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: zabbix-web
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_secret
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Asia/Karachi
    ports:
      - "8080:8080"
    depends_on: [zabbix-server]
    networks: [monitoring]
    restart: unless-stopped

  # ── Host 1: web-server ──────────────────────────────────────────────────────
  # nginx serving a static page, with the Zabbix agent co-located as a second
  # systemd service in the SAME container/OS instance (real host semantics —
  # see hosts/web-server/Dockerfile) so `systemctl restart nginx` runs
  # directly, no docker exec needed.
  # Faults: web-down, web-disk-full

  web-server:
    build: ./hosts/web-server
    container_name: host-web-server
    privileged: true  # required to run systemd as PID 1 inside the container
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./hosts/web-server/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./hosts/web-server/html:/usr/share/nginx/html:ro
    stop_signal: SIGRTMIN+3
    networks: [hosts]
    restart: unless-stopped
    depends_on: [zabbix-server]

  # ── Host 2: app-server ──────────────────────────────────────────────────────
  # FastAPI app with leak / CPU-spike / crash endpoints, Zabbix agent
  # co-located the same way as web-server above.
  # Faults: app-memory-leak, app-cpu-spike, app-crash-loop

  app-server:
    build: ./hosts/app-server
    container_name: host-app-server
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    stop_signal: SIGRTMIN+3
    ports:
      - "80:8000"
    networks: [hosts]
    mem_limit: 512m
    restart: unless-stopped
    depends_on: [zabbix-server]

  # ── Host 3: db-server ───────────────────────────────────────────────────────
  # PostgreSQL with a low connection limit.
  # Faults: db-connection-exhaustion, db-long-query

  db-server:
    image: postgres:16-alpine
    container_name: host-db-server
    environment:
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: appdb
    command: postgres -c max_connections=20 -c log_min_duration_statement=500
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./hosts/db-server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [hosts]
    restart: unless-stopped

  zabbix-agent-db:
    build:
      context: ./hosts/db-server
      dockerfile: agent.Dockerfile
    container_name: agent-db-server
    hostname: agent-db-server
    environment:
      ZBX_HOSTNAME: db-server
      ZBX_SERVER_HOST: zabbix-server
      PGPASSWORD: dbpass
    pid: "service:db-server"
    networks: [hosts]
    depends_on: [db-server, zabbix-server]
    restart: unless-stopped

  # ── Host 4: cache-server ────────────────────────────────────────────────────
  # Redis with a very low maxmemory, Zabbix agent co-located the same way as
  # web-server above.
  # Faults: cache-eviction-storm, cache-down

  cache-server:
    build: ./hosts/cache-server
    container_name: host-cache-server
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    stop_signal: SIGRTMIN+3
    networks: [hosts]
    restart: unless-stopped
    depends_on: [zabbix-server]

  # ── Host 5: worker-server ───────────────────────────────────────────────────
  # Celery worker backed by Redis, Zabbix agent co-located the same way as
  # web-server above.
  # Faults: worker-queue-backup

  worker-server:
    build: ./hosts/worker-server
    container_name: host-worker-server
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    stop_signal: SIGRTMIN+3
    depends_on: [cache-server, zabbix-server]
    networks: [hosts]
    restart: unless-stopped

networks:
  monitoring:
  hosts:

volumes:
  zabbix-db-data:
  db-data:
