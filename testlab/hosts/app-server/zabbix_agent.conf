# Zabbix Agent 2 configuration for app-server
Server=zabbix-server
ServerActive=zabbix-server
Hostname=app-server

# Agent listens on default port
ListenPort=10050

# Log to stdout (Docker-friendly)
LogType=console

# Allow the incident agent to run remediation commands directly on this host
# via script.execute (execute_on=0) instead of proxying through the Zabbix
# server (test environment only).
AllowKey=system.run[*]
