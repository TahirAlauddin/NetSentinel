# Zabbix Agent 2 configuration for web-server
Server=zabbix-server
ServerActive=zabbix-server
Hostname=web-server

# Agent listens on default port
ListenPort=10050

# Log to stdout (Docker-friendly)
LogType=console

# Enable nginx status monitoring plugin
Plugins.Nginx.Status.URL=http://localhost/nginx_status

# Allow root execution for remediation scripts (test environment only)
AllowKey=system.run[*]
