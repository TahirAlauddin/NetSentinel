# Zabbix Agent 2 configuration for db-server
Server=zabbix-server
ServerActive=zabbix-server
Hostname=db-server

# Agent listens on default port
ListenPort=10050

# Log to stdout (Docker-friendly)
LogType=console

# Allow running the connection-count check script and remediation scripts (test environment only)
AllowKey=system.run[*]
